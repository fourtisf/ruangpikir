# Pengaturan nginx situs ruangpikir.id yang ikut repo.
# Di-include dari /etc/nginx/sites-available/ruangpikir (dibuat deploy/setup-vps.sh).
# Setelah file ini berubah, `ruangpikir-deploy` mengecek (nginx -t) lalu me-reload nginx otomatis.

access_log /var/log/ruangpikir/access.log;
error_page 404 /404.html;

location / {
    try_files $uri $uri/ =404;
}

# Statistik tanpa cookie: website mengirim nama kejadian (tes-mulai, klik-instagram, ...) ke /e/<nama>.
# Cukup tercatat di access log di atas, lalu dirangkum deploy/stats-report.sh.
location ^~ /e/ {
    return 204;
}

# Laporan statistik (dibuat ulang tiap 10 menit), dikunci password dari deploy/setup-stats.sh.
location ^~ /statistik/ {
    alias /var/lib/ruangpikir-stats/;
    auth_basic "Statistik Ruang Pikir";
    auth_basic_user_file /etc/nginx/ruangpikir-stats.htpasswd;
}
